<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wanderblade</title>
<style>
@font-face { font-family: KF; src: url('assets/font/KenneyFuture.ttf'); }
:root { --ink:#1b2233; --panel:#fff7e6; --orange:#ffa62b; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:#10141f; font-family: KF, system-ui, sans-serif; color:var(--ink); overflow:hidden; }
#wrap { position:relative; height:min(100vh, calc(100vw * 16 / 9)); aspect-ratio:9/16; margin:0 auto; top:50%; transform:translateY(-50%); }
canvas { width:100%; height:100%; display:block; }
.layer { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1em; text-align:center; padding:1em; }
#menu { display:flex; background:rgba(16,20,31,.84); color:#fff; }
#menu h1 { margin:0; font-size:3.4em; line-height:1; color:var(--orange); text-shadow:0 .08em 0 #7a3b00; }
.row { display:flex; gap:.7em; justify-content:center; flex-wrap:wrap; }
.row > span { background:#0006; padding:.5em .9em; border-radius:.6em; }
button { font-family:inherit; font-size:1em; border:.16em solid var(--ink); border-radius:.6em; background:#e8edf5; color:var(--ink); padding:.55em .9em; cursor:pointer; box-shadow:0 .2em 0 #0004; }
button:active { transform:translateY(.12em); box-shadow:none; }
button:disabled { opacity:.4; cursor:default; }
button.go { background:var(--orange); font-size:1.7em; padding:.4em 1.8em; }
.hint { margin:0; font-size:.75em; opacity:.85; line-height:1.6; }
#pick { background:rgba(16,20,31,.8); color:#fff; }
#pick h2 { margin:0; font-size:1.2em; }
#cards { display:flex; flex-direction:column; gap:.8em; width:92%; }
.card { background:var(--panel); color:var(--ink); border:.25em solid; border-radius:.9em; padding:.8em 1em; display:flex; flex-direction:column; gap:.35em; cursor:pointer; }
.card b { font-size:1.2em; } .card span { font-size:.85em; } .card small { font-size:.7em; }
#over { background:rgba(16,20,31,.86); color:#fff; }
#log { position:absolute; left:4%; right:4%; top:66%; display:none; background:#fff7e6; border:.18em solid var(--ink); border-radius:.8em; padding:.6em .9em; font-size:.8em; line-height:1.5; min-height:7.2em; }
#log p { margin:0 0 .3em; opacity:.45; } #log p.new { opacity:1; font-weight:bold; }
#ctl { position:absolute; left:4%; right:4%; bottom:3%; display:none; gap:.8em; }
#ctl button { flex:1; padding:1.1em .5em; font-size:1.2em; touch-action:none; user-select:none; }
#bBlock.rdy { background:#6fb5ff; } #bSkill.rdy { background:var(--orange); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="540" height="960"></canvas>
  <div id="log"></div>
  <div id="ctl"><button id="bBlock">BLOCK</button><button id="bSkill">SKILL</button></div>
  <div id="menu" class="layer"></div>
  <div id="pick" class="layer"><h2 id="cardT"></h2><div id="cards"></div><button id="reroll" onclick="reroll()"></button></div>
  <div id="over" class="layer"></div>
</div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
